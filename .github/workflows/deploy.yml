name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

# kintsugi (NOR-158 audit + swarm): two quick pushes could deploy out of order and leave an older commit live.
#   The group runs one deploy at a time but does NOT guarantee push order (GitHub keeps one pending run and
#   replaces it). So each run also checks, just before deploying, that it is still main's tip; if a newer
#   commit exists, it skips (that newer run deploys). Serialized + tip check = the newest commit deploys last.
concurrency:
  group: pages-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # kintsugi: the key once passed through hands held only by a name that could be moved,
    #   on a runtime already past its end; now each hand is one fixed commit on living ground,
    #   and the crack where trust was borrowed runs gold.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Deploy only if this commit is still main's tip
        id: tip
        run: |
          tip=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1)
          if [ -z "$tip" ]; then echo "::error::could not read the tip of main"; exit 1; fi
          if [ "$tip" = "$GITHUB_SHA" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::main moved to $tip; skipping the deploy of $GITHUB_SHA (the newer run deploys)"; echo "deploy=false" >> "$GITHUB_OUTPUT"; fi

      - if: steps.tip.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: "4.151.1"
          packageManager: bun
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=northwoods-sentinel --branch=main
