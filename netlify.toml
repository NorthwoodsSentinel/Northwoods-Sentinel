[build]
  command = "npm run build"
  publish = "dist"

# Doors That Only Watch moved from /essays to /drift (2026-08-07 commit, pushed 2026-08-17)
[[redirects]]
  from = "/essays/2026-08-06-doors-that-only-watch"
  to = "/drift/2026-08-06-doors-that-only-watch/"
  status = 301
[[redirects]]
  from = "/essays/2026-08-06-doors-that-only-watch/*"
  to = "/drift/2026-08-06-doors-that-only-watch/"
  status = 301

# No SPA catch-all: this is a static site. Missing paths get the real 404 page (src/pages/404.astro → dist/404.html),
# which Netlify serves with a 404 status automatically. Removed 2026-08-17 (a nonexistent URL used to return the homepage with 200).
